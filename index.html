<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calu Pastelería - Costos y Recetas</title>
  <style>
    :root {
      --primary: #e8a598;
      --primary-dark: #d28b7e;
      --bg: #fffaf8;
      --card-bg: #ffffff;
      --text: #4a3e3d;
      --border: #f0d8d2;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      color: var(--primary-dark);
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1fr solid var(--border);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: 600;
      font-size: 0.9em;
    }

    input, select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 1em;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-dark);
    }

    .btn-danger {
      background-color: #e74c3c;
      padding: 4px 8px;
      font-size: 0.8em;
    }

    .btn-danger:hover {
      background-color: #c0392b;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .total-box {
      margin-top: 15px;
      padding: 15px;
      background-color: var(--bg);
      border-radius: 8px;
      text-align: right;
      font-size: 1.2em;
      font-weight: bold;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calu Pastelería 🧁</h1>

    <div class="grid">
      <!-- SECCIÓN 1: GESTIÓN DE INSUMOS -->
      <div class="card">
        <h2>1. Insumos / Ingredientes</h2>
        <form id="form-insumo">
          <div>
            <label>Nombre del Insumo:</label>
            <input type="text" id="insumo-nombre" placeholder="Ej. Harina 0000" required>
          </div>
          <div style="display: flex; gap: 10px;">
            <div style="flex: 2;">
              <label>Cantidad total paquete:</label>
              <input type="number" step="0.01" id="insumo-cantidad" placeholder="1" required>
            </div>
            <div style="flex: 1;">
              <label>Unidad:</label>
              <select id="insumo-unidad">
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="litro">litro</option>
                <option value="ml">ml</option>
                <option value="un">unidad</option>
              </select>
            </div>
          </div>
          <div>
            <label>Precio de compra ($):</label>
            <input type="number" step="0.01" id="insumo-precio" placeholder="1000" required>
          </div>
          <button type="submit">Guardar Insumo</button>
        </form>

        <h3>Mis Insumos</h3>
        <ul id="lista-insumos"></ul>
      </div>

      <!-- SECCIÓN 2: CALCULADORA DE RECETAS -->
      <div class="card">
        <h2>2. Armar Receta</h2>
        <form id="form-receta">
          <div>
            <label>Seleccionar Insumo:</label>
            <select id="select-insumo" required>
              <option value="">-- Elige un ingrediente --</option>
            </select>
          </div>
          <div>
            <label>Cantidad requerida para la receta:</label>
            <input type="number" step="0.01" id="receta-cantidad" placeholder="Ej. 250 (g) o 0.25 (kg)" required>
          </div>
          <button type="submit">Agregar a la Receta</button>
        </form>

        <h3>Ingredientes de la Receta</h3>
        <ul id="lista-receta"></ul>

        <div class="total-box">
          Costo Total: $<span id="costo-total">0.00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Variables de estado
    let insumos = JSON.parse(localStorage.getItem('insumos')) || [];
    let recetaActual = [];

    // Referencias HTML
    const formInsumo = document.getElementById('form-insumo');
    const listaInsumos = document.getElementById('lista-insumos');
    const selectInsumo = document.getElementById('select-insumo');
    const formReceta = document.getElementById('form-receta');
    const listaReceta = document.getElementById('lista-receta');
    const costoTotalEl = document.getElementById('costo-total');

    // Convertir todo a unidad base (gramos, mililitros o unidades individuales)
    function obtenerPrecioBase(insumo) {
      let cantidadBase = insumo.cantidad;
      if (insumo.unidad === 'kg' || insumo.unidad === 'litro') {
        cantidadBase = insumo.cantidad * 1000;
      }
      return insumo.precio / cantidadBase;
    }

    // Guardar insumo
    formInsumo.addEventListener('submit', (e) => {
      e.preventDefault();
      const nuevoInsumo = {
        id: Date.now(),
        nombre: document.getElementById('insumo-nombre').value,
        cantidad: parseFloat(document.getElementById('insumo-cantidad').value),
        unidad: document.getElementById('insumo-unidad').value,
        precio: parseFloat(document.getElementById('insumo-precio').value)
      };

      insumos.push(nuevoInsumo);
      localStorage.setItem('insumos', JSON.stringify(insumos));
      formInsumo.reset();
      renderInsumos();
    });

    // Borrar insumo
    function borrarInsumo(id) {
      insumos = insumos.filter(item => item.id !== id);
      localStorage.setItem('insumos', JSON.stringify(insumos));
      renderInsumos();
    }

    // Renderizar Insumos en la UI y en el Select
    function renderInsumos() {
      listaInsumos.innerHTML = '';
      selectInsumo.innerHTML = '<option value="">-- Elige un ingrediente --</option>';

      insumos.forEach(item => {
        // Render lista
        const li = document.createElement('li');
        li.innerHTML = `
          <span><strong>${item.nombre}</strong> (${item.cantidad} ${item.unidad} - $${item.precio})</span>
          <button class="btn-danger" onclick="borrarInsumo(${item.id})">X</button>
        `;
        listaInsumos.appendChild(li);

        // Render select
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.nombre} ($${item.precio} / ${item.cantidad}${item.unidad})`;
        selectInsumo.appendChild(option);
      });
    }

    // Agregar ingrediente a la receta
    formReceta.addEventListener('submit', (e) => {
      e.preventDefault();
      const insumoId = parseInt(selectInsumo.value);
      const cantidadUsada = parseFloat(document.getElementById('receta-cantidad').value);

      const insumo = insumos.find(i => i.id === insumoId);
      if (!insumo) return;

      const precioUnitario = obtenerPrecioBase(insumo);
      
      // Ajuste si ingresa en gramos cuando el insumo se guardó en kg
      let cantidadProcesada = cantidadUsada;
      let costoItem = precioUnitario * cantidadProcesada;

      recetaActual.push({
        id: Date.now(),
        nombre: insumo.nombre,
        cantidadUsada,
        unidad: insumo.unidad,
        costo: costoItem
      });

      formReceta.reset();
      renderReceta();
    });

    // Borrar ingrediente de la receta
    function borrarRecetaItem(id) {
      recetaActual = recetaActual.filter(item => item.id !== id);
      renderReceta();
    }

    // Renderizar Receta y calcular Total
    function renderReceta() {
      listaReceta.innerHTML = '';
      let total = 0;

      recetaActual.forEach(item => {
        total += item.costo;
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${item.nombre} - ${item.cantidadUsada} ${item.unidad}</span>
          <span><strong>$${item.costo.toFixed(2)}</strong> 
            <button class="btn-danger" onclick="borrarRecetaItem(${item.id})">X</button>
          </span>
        `;
        listaReceta.appendChild(li);
      });

      costoTotalEl.textContent = total.toFixed(2);
    }

    // Carga inicial
    renderInsumos();
  </script>
</body>
</html>
